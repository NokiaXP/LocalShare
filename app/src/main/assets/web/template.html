<!DOCTYPE html>
<!-- Part of LocalShare - https://github.com/PapirusDevelopmentTeam/LocalShare -->
<html lang="en"
      x-data="{
        darkMode: localStorage.getItem('dark') === 'true' ||
                 (!('dark' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
      }"
      :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="generator" content="LocalShare">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{appname}} - Shared Files</title>
    <link rel="icon" type="image/png" href="/{{token}}/favicon">
    <link rel="stylesheet" href="/{{token}}/static/css/tailwind.css">

    <script defer src="/{{token}}/static/js/alpine.min.js"></script>
    <script src="/{{token}}/static/js/main.js"></script>

    <script>
        window.initialFiles = {{filelist}};
        window.token = '{{token}}';
    </script>
</head>
<body x-data="fileManager(window.initialFiles, window.token)"
      x-init="initSSE()"
      @keydown.window.left="isSlideshow && prevSlide()"
      @keydown.window.right="isSlideshow && nextSlide()">

<header class="ls-header">
    <div class="flex items-center gap-4">
        <img src="/{{token}}/favicon/medium" alt="Logo" class="w-10 h-10" />
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">{{appname}}</h1>
    </div>

    <div class="flex items-center gap-2">
        <button @click="toggleSidebar()"
                class="ls-btn-icon relative">
            <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
            </svg>
            <span x-show="hasNewSharedContent"
                  class="absolute top-1 right-1 flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
        </button>

        <button @click="darkMode = !darkMode; localStorage.setItem('dark', darkMode)"
                class="ls-btn-icon">
            <svg x-show="darkMode" class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
            </svg>
            <svg x-show="!darkMode" class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </div>
</header>

<div class="max-w-6xl mx-auto p-4">
    <div class="ls-toolbar">
        <div class="flex items-center gap-2">
            <select x-model="sortKey" class="ls-toolbar-select">
                <option value="filename">Filename</option>
                <option value="size">Size</option>
                <option value="mimeType">Type</option>
            </select>
            <button @click="sortAsc = !sortAsc" class="ls-btn-toolbar">
                <span x-text="sortAsc ? '↓' : '↑'" class="dark:text-white"></span>
            </button>
            <div class="h-6 w-px bg-gray-200 dark:bg-slate-700 mx-2"></div>
            <button @click="showGrid()" :class="isGrid ? 'active' : 'inactive'" class="ls-btn-view-switcher">Grid</button>
            <button @click="showList()" :class="isList ? 'active' : 'inactive'" class="ls-btn-view-switcher">List</button>
            <button @click="toggleSlideshow()" :class="isSlideshow ? 'active' : 'inactive'" class="ls-btn-view-switcher">Slide</button>
        </div>

        <a x-show="files.length > 0" :href="'/' + window.token + '/?download'" class="ls-btn-primary">
            Download All (ZIP)
        </a>
    </div>

    <!-- Grid & List Views -->
    <ul x-show="!isSlideshow" :class="isGrid ? 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6' : 'flex flex-col space-y-3'" class="list-none p-0">
        <template x-for="(file, index) in sortedFiles" :key="file.fileId">
            <li :class="isGrid ? 'ls-card-grid' : 'ls-card-list'">

                <div :class="isGrid ? 'contents' : 'flex items-center gap-4 w-full'">
                    <div @click="currentIndex = index; toggleSlideshow()"
                         :class="isGrid ? 'ls-preview-box-grid' : 'ls-preview-box-list'">
                        <img :src="'/' + window.token + '/icon/' + file.icon"
                             x-init="loadPreview($el, file)"
                             :class="isGrid ? 'w-20 h-20 p-2 object-contain' : 'w-8 h-8 object-contain'"
                             class="transition-all duration-300 group-hover:scale-105" />
                    </div>

                    <div :class="isGrid ? 'ls-card-content-grid' : 'ls-card-content-list'">
                        <span x-text="file.filename" :title="file.filename" class="font-bold text-gray-900 dark:text-white truncate block w-full"></span>
                        <span x-text="humanFileSize(file.size)" class="text-xs text-gray-500 dark:text-slate-400 font-mono"></span>

                        <div class="mt-3 flex gap-2" :class="isGrid ? 'mt-auto justify-center' : 'justify-end col-span-2 mt-0'">
                            <button @click="copyLink(file.fileId)"
                                    class="ls-btn-secondary"
                                    title="Copy Link">
                                <svg x-show="copiedId !== file.fileId" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                                </svg>
                                <svg x-show="copiedId === file.fileId" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </button>
                            <a :href="'/' + window.token + '/file/' + file.fileId + '?download'" class="ls-btn-action-small get">Get</a>
                            <a :href="'/' + window.token + '/file/' + file.fileId" class="ls-btn-action-small open">Open</a>
                        </div>
                    </div>
                </div>
            </li>
        </template>
    </ul>

    <!-- Slideshow View -->
    <template x-if="currentFile?.icon">
        <div x-show="isSlideshow"
             class="ls-slideshow-container">

            <!-- Slideshow Header -->
            <div class="ls-slideshow-header">
                <div class="flex items-center gap-4">
                    <span x-text="(currentIndex + 1) + ' / ' + (sortedFiles?.length || 0)" class="ls-slideshow-count"></span>
                    <span x-text="currentFile?.filename" class="ls-slideshow-title"></span>
                </div>
                <button @click="toggleSlideshow()" class="ls-slideshow-btn-close">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Slideshow Main -->
            <div class="ls-slideshow-main">
                <button @click="prevSlide()" class="ls-slideshow-btn-nav left-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>

                <div class="max-w-full max-h-full flex items-center justify-center">
                    <img :src="'/' + window.token + '/icon/' + currentFile?.icon"
                         x-init="loadPreview($el, currentFile); $watch('currentFile', (val) => loadPreview($el, val))"
                         data-is-slideshow="true"
                         class="ls-slideshow-img" />
                </div>

                <button @click="nextSlide()" class="ls-slideshow-btn-nav right-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- Slideshow Footer -->
            <div class="ls-slideshow-footer">
                <a :href="'/' + window.token + '/file/' + currentFile?.fileId + '?download'"
                   target="_blank"
                   class="ls-slideshow-btn-action secondary">
                    Download
                </a>
                <a :href="'/' + window.token + '/file/' + currentFile?.fileId"
                   target="_blank"
                   class="ls-slideshow-btn-action primary">
                    Open Original
                </a>
                <div class="w-full text-center mt-2">
                    <span x-text="humanFileSize(currentFile?.size || 0)" class="ls-slideshow-count"></span>
                </div>
            </div>
        </div>
    </template>
</div>

<footer class="ls-main-footer">
    <p>Shared via <a href="{{appurl}}" class="text-blue-500 hover:underline font-medium">{{appname}}</a></p>
    <div class="mt-4 flex flex-wrap justify-center items-center gap-y-3 opacity-75">
        <span>Icons by <a href="https://github.com/PapirusDevelopmentTeam/papirus-icon-theme" target="_blank" class="hover:text-blue-500 underline">Papirus Team</a></span>
        <span class="text-gray-300 dark:text-slate-700 mx-2">•</span>
        <span>Built with <a href="https://alpinejs.dev/" target="_blank" class="hover:text-blue-500 underline">Alpine.js</a> & <a href="https://tailwindcss.com/" target="_blank" class="hover:text-blue-500 underline">Tailwind CSS</a></span>
    </div>
</footer>

<!-- Sidebar Overlay -->
<div x-show="sidebarOpen"
     class="fixed inset-0 z-50 overflow-hidden"
     style="display: none;">

    <!-- Backdrop -->
    <div x-show="sidebarOpen"
         x-transition:enter="ease-in-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in-out duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity">
    </div>

    <!-- Sidebar Panel -->
    <div x-show="sidebarOpen"
         x-transition:enter="transform transition ease-in-out duration-300"
         x-transition:enter-start="-translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transform transition ease-in-out duration-300"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="-translate-x-full"
         class="ls-sidebar-panel">

        <!-- Header -->
        <div class="ls-sidebar-header">
            <h2 class="text-xl font-bold text-gray-800 dark:text-white">Shared Content</h2>
            <button @click="sidebarOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Content List -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <template x-for="item in sharedContent" :key="item.id">
                <div class="ls-sidebar-content-item">
                    <div class="flex items-start gap-4">
                        <div class="flex-1 min-w-0">
                            <!-- Show MimeType/Label only if it's not standard text -->
                            <template x-if="item.mimeType !== 'text/plain'">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="ls-sidebar-item-label" x-text="item.mimeType"></span>
                                    <template x-if="item.label">
                                        <span class="ls-sidebar-item-sublabel" x-text="item.label"></span>
                                    </template>
                                </div>
                            </template>

                            <!-- Plain text view -->
                            <template x-if="item.mimeType === 'text/plain'">
                                <p class="ls-sidebar-item-text" x-text="item.text"></p>
                            </template>

                            <!-- Fallback for other types -->
                            <template x-if="item.mimeType !== 'text/plain'">
                                <pre class="ls-sidebar-item-data" x-text="item.data"></pre>
                            </template>
                        </div>

                        <button @click="copyToClipboard(item.text || item.data)" class="ls-sidebar-btn-copy">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </template>

            <div x-show="sharedContent.length === 0" class="ls-sidebar-empty">
                <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
                <p>No shared content.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
