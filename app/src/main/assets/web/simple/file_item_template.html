<li class="ls-card-list">
    <div class="flex items-center gap-4 w-full">
        <div class="ls-preview-box-list">
            <img src="{{token}}/icon/{{icon}}" class="w-full h-full object-contain" alt="{{mimetype}}">
        </div>
        <div class="flex-1 min-w-0">
            <p class="ls-file-name text-base">{{filename}}</p>
            <p class="ls-file-size">{{filesize}}</p>
        </div>
        <div class="ls-card-actions-list">
            <a href="/{{token}}/file/{{fileid}}"
               target="_blank"
               class="ls-btn-action-small open flex-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                <span>Abrir</span>
            </a>
            <a href="/{{token}}/file/{{fileid}}?download"
               class="ls-btn-action-small get flex-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Descargar</span>
            </a>
        </div>
    </div>
</li>
